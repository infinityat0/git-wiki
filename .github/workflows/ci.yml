name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stubbed: task F8 wires up Playwright (browser install, `playwright test`,
      # and diff-artifact upload on failure). Kept as a separate job so the
      # pipeline shape is already in place.
